name: Validate landing page

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publishable files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s lime-light.html
          test -s privacy.html
          test -s terms.html
          test -s apply/index.html
          test -s apply/complete/index.html
          cmp index.html lime-light.html
          python -m unittest tests.test_static_release -v
          python scripts/validate_static_release.py .
      - name: Validate browser behavior
        run: |
          python -m pip install playwright==1.54.0
          python -m unittest tests.test_browser_behavior -v
